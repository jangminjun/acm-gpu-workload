apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-burn-app
  namespace: gpu-workload-app # ApplicationSet에 설정한 네임스페이스와 동일해야 함
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-burn
  template:
    metadata:
      labels:
        app: gpu-burn
    spec:
      containers:
      - name: gpu-burn
        # NVIDIA GPU를 실제로 사용하는 이미지
        image: resueman/gpu-burn:latest 
        args: ["600"] # 600초(10분) 동안 실행
        resources:
          limits:
            nvidia.com/gpu: 1 # 핵심: 이 설정이 있어야 GPU 노드로 배정됨
          requests:
            nvidia.com/gpu: 1
      restartPolicy: Always